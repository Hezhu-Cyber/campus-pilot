[project]
name = "campus-pilot-assistant"
version = "0.1.0"
description = "CampusPilot LangChain and LangGraph assistant service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.7,<3",
    "langchain>=1.3,<2",
    "langgraph>=1.0,<2",
    "langchain-openai>=1.4,<2",
    "prometheus-client>=0.21,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
