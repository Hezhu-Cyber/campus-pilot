<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>校园派 - 密码登录</title>
  <link href="./css/login.css?v=2" rel="stylesheet">
  <!-- 引入样式 -->
  <link rel="stylesheet" href="./css/element.css">
  <link href="./css/theme.css" rel="stylesheet">

  <style type="text/css">
      .el-radio__input.is-checked .el-radio__inner {
          border-color: #5b5ce2;
          background: #5b5ce2;
      }
      .el-input__inner:focus {
          border: 1px solid #5b5ce2;
      }
  </style>
</head>
<body>
<div id="app">
  <div class="login-container">
    <div class="header">
      <div class="header-back-btn" @click="goBack"><i class="el-icon-arrow-left"></i></div>
      <div class="header-title">选择身份登录&nbsp;&nbsp;&nbsp;</div>
    </div>
    <div class="content">
      <div class="login-form">
        <div class="role-label">请选择本次登录身份</div>
        <div class="role-selector">
          <div v-for="item in roles" :key="item.value" class="role-option"
               :class="{active: selectedRole === item.value}" @click="selectedRole = item.value">
            <i :class="item.icon"></i>
            <span>{{item.label}}</span>
          </div>
        </div>
        <div class="role-hint">{{selectedRoleHint}}</div>
        <el-input placeholder="请输入手机号" v-model="form.phone">
        </el-input>
        <div style="height: 5px"></div>
        <el-input type="password" show-password placeholder="请输入密码" v-model="form.password">
        </el-input>
        <div style="text-align: center; color: #8c939d;margin: 5px 0"><a href="javascript:void(0)">忘记密码</a></div>
        <el-button @click="login" style="width: 100%; background-color:#5b5ce2; color: #fff;">登录</el-button>
        <div style="text-align: right; color:#333333; margin: 5px 0"><a href="/login.html">验证码登录</a></div>
      </div>
      <div class="login-radio">
        <div>
          <input id="readed" type="checkbox" name="readed" v-model="radio">
          <label for="readed"></label>
        </div>
        <div>我已阅读并同意
          <a href="javascript:void(0)">
          《校园派用户服务协议》</a>、
          <a href="javascript:void(0)">《隐私政策》</a>
          等，接受免除或者限制责任、诉讼管辖约定等粗体标示条款
        </div>
      </div>
    </div>
  </div>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<!-- 引入组件库 -->
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script>

  const app = new Vue({
    el: "#app",
    data: {
      radio: "",
      selectedRole: sessionStorage.getItem("loginRole") || "STUDENT",
      roles: [
        {value: "STUDENT", label: "学生", icon: "el-icon-user"},
        {value: "ORGANIZER", label: "活动组织者", icon: "el-icon-s-flag"},
        {value: "ADMIN", label: "管理员", icon: "el-icon-s-tools"}
      ],
      form:{
      }
    },
    computed: {
      selectedRoleHint() {
        if (this.selectedRole === "ORGANIZER") return "演示账号 13838411438，登录后进入活动发布与管理工作台";
        if (this.selectedRole === "ADMIN") return "演示账号 13686869696，登录后进入系统管理工作台";
        return "首次使用手机号验证码登录会自动创建学生账号";
      }
    },
    watch: {
      selectedRole(value) { sessionStorage.setItem("loginRole", value); }
    },
    methods: {
      login(){
        if(!this.radio){
          this.$message.error("请先确认阅读用户协议！");
          return;
        }
        axios.post("/user/login", this.form)
          .then(({data}) => completeRoleLogin(data, this.selectedRole))
          .catch(err => this.$message.error(err))
      },
      goBack(){
        history.back();
      }
    }
  })
</script>
</body>
</html>
